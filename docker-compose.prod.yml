version: '3.8'

services:
  # ── PostgreSQL Database ──────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: im_db_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      POSTGRES_DB: ${POSTGRES_DB:-instantmechanic}
    volumes:
      - im_postgres_data:/var/lib/postgresql/data
    networks:
      - im_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── NestJS Backend API ───────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: instant-mechanic-api:latest
    container_name: im_api_prod
    restart: always
    ports:
      - '3000:3000'
    env_file:
      - .env.production
    depends_on:
      db:
        condition: service_healthy
    networks:
      - im_network

  # ── Next.js Frontend ─────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000/api/v1}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-http://localhost:3000}
        NEXT_PUBLIC_USE_MOCK: "false"
    image: instant-mechanic-frontend:latest
    container_name: im_frontend_prod
    restart: always
    ports:
      - '3001:3001'
    depends_on:
      - api
    networks:
      - im_network

networks:
  im_network:
    driver: bridge

volumes:
  im_postgres_data:

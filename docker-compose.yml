version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: instant_mechanic
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: .
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/instant_mechanic?schema=public
      DIRECT_URL: postgresql://postgres:postgres@postgres:5432/instant_mechanic?schema=public
    depends_on:
      - postgres

volumes:
  pgdata:
